<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ραντεβού · Διαχείριση</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Noto+Serif+Display:wght@400&display=swap">
<style>
  :root{--bg:#0b0b0c;--panel:#141416;--panel-2:#1b1b1e;--line:#2a2a2e;--text:#f3efe6;--muted:#a39e93;--gold:#c9a24a;--gold-2:#e2c27a;--ok:#6fbf8e;--warn:#e6b85c;--err:#e07a6a}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Commissioner",system-ui,sans-serif}
  a{color:var(--gold-2)}
  button,input,select{font:inherit;color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{border-bottom:1px solid var(--line)}
  .head{display:flex;align-items:center;gap:12px;height:64px}
  .head b{font-family:"Noto Serif Display",Georgia,serif;font-weight:400;font-size:1.2rem}
  .head small{color:var(--muted)}
  .head .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:9px;padding:8px 13px;border:1px solid var(--line);background:none;cursor:pointer;text-decoration:none;color:var(--text);font-size:.9rem;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
  .btn.ok{border-color:#2f5a3e;color:#bfe8cd}
  .btn.no{border-color:#5a2f2a;color:#f3c3ba}
  .btn:disabled{opacity:.5;cursor:wait}
  input,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--gold)}

  .login{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .login h1{font-family:"Noto Serif Display",Georgia,serif;font-weight:400;margin:0 0 6px;font-size:1.6rem}
  .login p{color:var(--muted);margin:0 0 16px}
  .login input{width:100%;margin:0 0 10px}
  .login label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem;margin:0 0 14px}
  .login .btn{width:100%;justify-content:center;padding:11px}
  .err{color:var(--err);font-size:.9rem;min-height:1.3em;margin:8px 0 0}

  .tabs{display:flex;gap:6px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:none;border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--text);color:#111;border-color:var(--text);font-weight:600}
  .tab .n{opacity:.7;margin-left:4px}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:1.5rem;font-weight:500}
  .stat span{color:var(--muted);font-size:.82rem}

  .day{margin:0 0 18px}
  .day h3{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;font-weight:500}
  .bk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 8px;display:grid;grid-template-columns:76px 1fr auto;gap:4px 14px;align-items:start}
  .bk.cancelled{opacity:.5}
  .bk .tm{font-weight:600;font-size:1.05rem}
  .bk .tm small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
  .bk .who b{font-weight:600}
  .bk .who div{color:var(--muted);font-size:.9rem}
  .bk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .bk .more{grid-column:2 / -1;font-size:.9rem;color:var(--muted)}
  .bk .notes{grid-column:2 / -1;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
  .badge{display:inline-block;font-size:.72rem;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:2px;border:1px solid}
  .badge.pending{color:var(--warn);border-color:#5a4a26}
  .badge.confirmed{color:var(--ok);border-color:#2f5a3e}
  .badge.cancelled{color:var(--err);border-color:#5a2f2a}
  @media (max-width:640px){
    .bk{grid-template-columns:60px 1fr}
    .bk .acts{grid-column:1 / -1;justify-content:flex-start;margin-top:6px}
    .bk .more,.bk .notes{grid-column:1 / -1}
    .stats{grid-template-columns:repeat(3,1fr)}
  }
  .empty{color:var(--muted);padding:30px 0;text-align:center}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:30px 0}
  .box h2{font-family:"Noto Serif Display",Georgia,serif;font-weight:400;font-size:1.25rem;margin:0 0 4px}
  .box p{color:var(--muted);margin:0 0 12px;font-size:.9rem}
  .blockform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .blockform input[type=text]{flex:1;min-width:160px}
  .blk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
  .blk span{color:var(--muted)}
  .blk .btn{margin-left:auto;padding:5px 10px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#111;padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.4)}
</style>
</head>
<body>
<header><div class="wrap head">
  <div><b id="bizName">Ραντεβού</b><br><small>Διαχείριση</small></div>
  <span class="sp"></span>
  <a class="btn" id="bookLink" href="/" target="_blank" rel="noopener">Σελίδα κράτησης ↗</a>
  <button class="btn" id="logout" type="button" hidden>Έξοδος</button>
</div></header>

<section class="login" id="login">
  <h1>Είσοδος</h1>
  <p>Βάλτε το κλειδί διαχείρισης.</p>
  <form id="loginForm">
    <input id="key" type="password" autocomplete="current-password" placeholder="Κλειδί" required>
    <label><input type="checkbox" id="remember" style="width:auto;margin:0"> Να με θυμάσαι σε αυτή τη συσκευή</label>
    <button class="btn gold" type="submit">Είσοδος</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<main class="wrap" id="main" hidden>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="list"></div>

  <section class="box">
    <h2>Μπλοκάρισμα χρόνου</h2>
    <p>Μέρες ή ώρες που δεν μπορείτε (άδεια, άλλο ραντεβού). Δεν θα εμφανίζονται για κράτηση.</p>
    <form class="blockform" id="blockForm">
      <input type="date" id="bDate" required>
      <select id="bType"><option value="all">Όλη τη μέρα</option><option value="range">Από–έως</option></select>
      <input type="time" id="bFrom" step="1800" value="09:00" hidden>
      <input type="time" id="bTo" step="1800" value="12:00" hidden>
      <input type="text" id="bNote" placeholder="Σημείωση (προαιρετικό)" maxlength="120">
      <button class="btn gold" type="submit">Μπλοκάρισμα</button>
    </form>
    <div id="blocks" style="margin-top:12px"></div>
  </section>
</main>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const B = q.get('b') || 'arakron';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEYNAME = 'appt_admin_' + B;
  const store = {
    get() { try { return sessionStorage.getItem(KEYNAME) || localStorage.getItem(KEYNAME); } catch (e) { return null; } },
    set(v, remember) { try { sessionStorage.setItem(KEYNAME, v); if (remember) localStorage.setItem(KEYNAME, v); } catch (e) {} },
    clear() { try { sessionStorage.removeItem(KEYNAME); localStorage.removeItem(KEYNAME); } catch (e) {} },
  };
  let KEY = store.get(), data = null, tab = 'upcoming';
  $('bookLink').href = '/' + encodeURIComponent(B);

  const STATUS = { pending: 'Θέλει επιβεβαίωση', confirmed: 'Επιβεβαιωμένο', cancelled: 'Ακυρωμένο' };
  const longDate = d => new Date(d + 'T12:00:00').toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });

  async function api(body) {
    const r = await fetch('/.netlify/functions/appt-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ b: B, key: KEY, ...body }) });
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 401) { logout('Λάθος κλειδί.'); throw new Error('unauthorized'); }
    if (!r.ok) throw new Error(d.error || 'error');
    return d;
  }
  function toast(msg) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
  }
  function logout(msg) {
    store.clear(); KEY = null; data = null;
    $('main').hidden = true; $('logout').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || '';
  }

  async function load() {
    data = await api({ action: 'list' });
    $('login').hidden = true; $('main').hidden = false; $('logout').hidden = false;
    $('bDate').min = data.today;
    $('bizName').textContent = data.name; document.title = data.name + ' · Ραντεβού';
    render();
  }

  function render() {
    const today = data.today;
    const svcName = id => (data.services.find(s => s.id === id) || {}).name || id;
    const live = data.bookings.filter(b => b.status !== 'cancelled');
    const upcoming = live.filter(b => b.date >= today);
    const pending = upcoming.filter(b => b.status === 'pending');
    const weekEnd = new Date(today + 'T12:00:00'); weekEnd.setDate(weekEnd.getDate() + 7);
    const thisWeek = upcoming.filter(b => b.date < weekEnd.toISOString().slice(0, 10));
    $('stats').innerHTML = `
      <div class="stat"><b>${pending.length}</b><span>Θέλουν επιβεβαίωση</span></div>
      <div class="stat"><b>${thisWeek.length}</b><span>Τις επόμενες 7 μέρες</span></div>
      <div class="stat"><b>${upcoming.length}</b><span>Σύνολο επόμενων</span></div>`;

    const lists = {
      upcoming: { label: 'Επόμενα', items: upcoming },
      pending: { label: 'Θέλουν επιβεβαίωση', items: pending },
      past: { label: 'Προηγούμενα', items: live.filter(b => b.date < today).reverse() },
      cancelled: { label: 'Ακυρωμένα', items: data.bookings.filter(b => b.status === 'cancelled') },
    };
    $('tabs').innerHTML = Object.entries(lists).map(([k, v]) =>
      `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}">${v.label}<span class="n">${v.items.length}</span></button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

    const items = lists[tab].items;
    if (!items.length) { $('list').innerHTML = `<p class="empty">Κανένα ραντεβού εδώ.</p>`; }
    else {
      const byDay = {};
      items.forEach(b => (byDay[b.date] = byDay[b.date] || []).push(b));
      $('list').innerHTML = Object.entries(byDay).map(([d, arr]) => `
        <div class="day"><h3>${esc(longDate(d))}${d === today ? ' · σήμερα' : ''}</h3>
        ${arr.map(b => `
          <article class="bk ${b.status}">
            <div class="tm">${esc(b.time)}<small>έως ${esc(b.end)}</small></div>
            <div class="who"><b>${esc(svcName(b.service))}</b><span class="badge ${b.status}">${STATUS[b.status]}</span>
              <div>${esc(b.name)}${b.company ? ' · ' + esc(b.company) : ''} · ${esc((data.modes[b.mode] || {}).el || b.mode)}</div></div>
            <div class="acts">
              ${b.status === 'pending' ? `<button class="btn ok" data-act="confirm" data-id="${b.id}">✓ Επιβεβαίωση</button>` : ''}
              ${b.status !== 'cancelled' && b.date >= today ? `<button class="btn no" data-act="cancel" data-id="${b.id}">Ακύρωση</button>` : ''}
            </div>
            <div class="more"><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a> · <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>
              ${b.address ? ` · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}" target="_blank" rel="noopener">${esc(b.address)}</a>` : ''}
              ${b.extra ? ` · ${esc(b.extra)}` : ''}</div>
            ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ''}
          </article>`).join('')}
        </div>`).join('');
    }
    $('list').querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => act(btn));

    $('blocks').innerHTML = data.blocks.length ? data.blocks.map(x => `
      <div class="blk"><b>${esc(longDate(x.date))}</b><span>${x.allDay ? 'όλη τη μέρα' : esc(x.from) + '–' + esc(x.to)}${x.note ? ' · ' + esc(x.note) : ''}</span>
      <button class="btn" type="button" data-unblock="${x.id}" data-date="${x.date}">Αφαίρεση</button></div>`).join('') : '';
    $('blocks').querySelectorAll('[data-unblock]').forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      try { await api({ action: 'unblock', date: btn.dataset.date, id: btn.dataset.unblock }); toast('Αφαιρέθηκε'); await load(); } catch (e) { btn.disabled = false; }
    });
  }

  async function act(btn) {
    const b = data.bookings.find(x => x.id === btn.dataset.id);
    if (btn.dataset.act === 'cancel') {
      if (!confirm(`Ακύρωση του ραντεβού με ${b.name} (${longDate(b.date)}, ${b.time});\nΟ πελάτης θα ενημερωθεί με email.`)) return;
    }
    btn.disabled = true;
    try {
      await api({ action: btn.dataset.act, id: b.id });
      toast(btn.dataset.act === 'confirm' ? 'Επιβεβαιώθηκε, στάλθηκε email' : 'Ακυρώθηκε, στάλθηκε email');
      await load();
    } catch (e) { btn.disabled = false; if (e.message !== 'unauthorized') toast('Σφάλμα, δοκιμάστε ξανά'); }
  }

  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    KEY = $('key').value.trim();
    $('loginErr').textContent = '';
    try { await load(); store.set(KEY, $('remember').checked); $('key').value = ''; }
    catch (err) { if (err.message !== 'unauthorized') $('loginErr').textContent = 'Δεν ήταν δυνατή η σύνδεση.'; }
  };
  $('logout').onclick = () => logout();
  $('bType').onchange = () => { const r = $('bType').value === 'range'; $('bFrom').hidden = $('bTo').hidden = !r; };
  $('blockForm').onsubmit = async e => {
    e.preventDefault();
    const body = { action: 'block', date: $('bDate').value, note: $('bNote').value };
    if ($('bType').value === 'range') { body.from = $('bFrom').value; body.to = $('bTo').value; }
    try { await api(body); toast('Μπλοκαρίστηκε'); $('bNote').value = ''; await load(); }
    catch (err) { if (err.message !== 'unauthorized') toast('Ελέγξτε ημερομηνία και ώρες'); }
  };

  if (KEY) load().catch(() => {});
})();
</script>
</body>
</html>
