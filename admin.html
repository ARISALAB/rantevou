<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48" id="icoIco">
<link rel="icon" type="image/svg+xml" href="/favicon.svg" id="icoSvg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" id="icoApple">
<meta name="theme-color" content="#ECEFF3">
<meta name="apple-mobile-web-app-title" content="Ραντεβού">
<link rel="manifest" href="/admin.webmanifest">
<title>Ραντεβού · Διαχείριση</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..700&display=swap">
<style>
  :root{--bg:#ECEFF3;--panel:#F7F8FA;--panel-2:#EEF1F5;--line:#CBD4DF;--text:#161B33;--muted:#4A5170;--gold:#2A3DD1;--gold-2:#2A3DD1;--marker:#F2DF3A;--ok:#1F8A55;--warn:#9A6A00;--err:#C93A3A}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Geologica",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--gold-2)}
  button,input,select,textarea{font:inherit;color:inherit}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px}
  header{border-bottom:1.5px solid var(--line)}
  .head{display:flex;align-items:center;gap:12px;height:64px}
  .head b{font-weight:620;font-size:1.12rem;letter-spacing:-.02em}
  .akron{width:34px;height:34px;border-radius:9px;background:#0b0b0c;display:grid;place-items:center;flex:none}
  .akron img{width:22px;height:22px}
  .made{font-size:.78rem;color:var(--muted);text-decoration:none}
  .made:hover{color:var(--text)}
  .head small{color:var(--muted)}
  .head .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 15px;border:1.5px solid var(--line);background:none;cursor:pointer;text-decoration:none;color:var(--text);font-size:.9rem;white-space:nowrap}
  .btn:hover{border-color:var(--muted)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:550}
  .btn.ok{border-color:#9fd2b5;color:#14653d;background:#e6f4ec}
  .btn.no{border-color:#ebb7b1;color:#a12a2a}
  .btn:disabled{opacity:.5;cursor:wait}
  input,select{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
  textarea{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px;resize:vertical;min-height:64px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}

  .login{max-width:380px;margin:12vh auto 0;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:26px}
  .login h1{font-weight:640;letter-spacing:-.03em;margin:0 0 6px;font-size:1.7rem}
  .login p{color:var(--muted);margin:0 0 16px}
  .login input{width:100%;margin:0 0 10px}
  .login label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.88rem;margin:0 0 14px}
  .login .btn{width:100%;justify-content:center;padding:11px}
  .err{color:var(--err);font-size:.9rem;min-height:1.3em;margin:8px 0 0}

  .tabs{display:flex;gap:6px;margin:22px 0 16px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:none;border-radius:20px;padding:6px 14px;cursor:pointer;color:var(--muted)}
  .tab[aria-selected="true"]{background:var(--text);color:#fff;border-color:var(--text);font-weight:600}
  .tab .n{opacity:.7;margin-left:4px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .stat b{display:block;font-size:1.5rem;font-weight:500}
  .stat span{color:var(--muted);font-size:.82rem}

  .day{margin:0 0 18px}
  .day h3{font-size:.95rem;color:var(--text);margin:0 0 8px;font-weight:600}
  .day h3::first-letter{text-transform:uppercase}
  .bk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 8px;display:grid;grid-template-columns:76px 1fr auto;gap:4px 14px;align-items:start}
  .bk.cancelled{opacity:.5}
  .bk .tm{font-weight:600;font-size:1.05rem}
  .bk .tm small{display:block;color:var(--muted);font-weight:400;font-size:.8rem}
  .bk .who b{font-weight:600}
  .bk .who div{color:var(--muted);font-size:.9rem}
  .bk .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .bk .more{grid-column:2 / -1;font-size:.9rem;color:var(--muted)}
  .bk .notes{grid-column:2 / -1;background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:.9rem;white-space:pre-wrap}
  .badge{display:inline-block;font-size:.72rem;border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:2px;border:1px solid}
  .badge.pending{color:#6b4a00;border-color:transparent;background:var(--marker)}
  .badge.confirmed{color:var(--ok);border-color:#9fd2b5}
  .badge.cancelled{color:var(--err);border-color:#ebb7b1}
  .badge.src{color:var(--gold);border-color:#b9c1f2}
  @media (max-width:640px){
    .bk{grid-template-columns:60px 1fr}
    .bk .acts{grid-column:1 / -1;justify-content:flex-start;margin-top:6px}
    .bk .more,.bk .notes{grid-column:1 / -1}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  .empty{color:var(--muted);padding:30px 0;text-align:center}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:30px 0}
  .box h2{font-weight:600;letter-spacing:-.02em;font-size:1.2rem;margin:0 0 4px}
  .box p{color:var(--muted);margin:0 0 12px;font-size:.9rem}
  .blockform{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .blockform input[type=text]{flex:1;min-width:160px}
  .blk{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
  .blk span{color:var(--muted)}
  .blk .btn{margin-left:auto;padding:5px 10px}
  .views{display:flex;gap:4px;margin:18px 0 0;border-bottom:1px solid var(--line)}
  .view{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;margin-bottom:-1px}
  .view[aria-selected="true"]{color:var(--text);border-bottom-color:var(--gold)}

  /* Ρυθμίσεις */
  .set .box{margin:18px 0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fld{display:flex;flex-direction:column;gap:5px;min-width:0}
  .fld>span{font-size:.8rem;color:var(--muted)}
  .fld.full{grid-column:1 / -1}
  .fld input,.fld select,.fld textarea{width:100%}
  .hint{font-size:.8rem;color:var(--muted)}
  .colorrow{display:flex;gap:8px;align-items:center}
  .colorrow input[type=color]{width:48px;height:42px;padding:3px;cursor:pointer}
  .hrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .hrow:first-of-type{border-top:0}
  .hrow .dn{display:flex;align-items:center;gap:8px;font-weight:500}
  .ranges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .range{display:flex;align-items:center;gap:4px}
  .range input{padding:7px 8px;width:auto}
  .closed{color:var(--muted);font-size:.9rem}
  .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}
  .x:hover{color:var(--err)}
  .link{background:none;border:0;color:var(--gold-2);cursor:pointer;padding:4px 0;font-size:.88rem}
  .svc{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;background:var(--panel-2)}
  .svc>summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
  .svc>summary::-webkit-details-marker{display:none}
  .svc>summary b{font-weight:600}
  .svc>summary small{color:var(--muted)}
  .svc>summary .sp{flex:1}
  .svc.off>summary b{color:var(--muted);text-decoration:line-through}
  .svc .body{padding:4px 14px 16px}
  .checks{display:flex;flex-wrap:wrap;gap:14px}
  .checks label,.sw{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.92rem}
  .checks input,.sw input{width:18px;height:18px;accent-color:var(--gold);margin:0}
  .savebar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 0 16px;display:flex;align-items:center;gap:12px;justify-content:flex-end}
  .savebar span{color:var(--muted);font-size:.88rem}
  .bad{border-color:var(--err)!important}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .hrow{grid-template-columns:1fr}
  }
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;box-shadow:0 12px 30px -10px rgba(22,27,51,.5)}
</style>
</head>
<body>
<header><div class="wrap head">
  <span class="akron" aria-hidden="true"><img src="https://www.arakronservices.gr/favicon.svg?v=3" alt=""></span>
  <div><b id="bizName">Ραντεβού</b><br><a class="made" href="https://rantevou.arakronservices.gr/" target="_blank" rel="noopener">Διαχείριση ραντεβού · AR Akron Services</a></div>
  <span class="sp"></span>
  <a class="btn" id="bookLink" href="/" target="_blank" rel="noopener">Σελίδα κράτησης ↗</a>
  <button class="btn" id="logout" type="button" hidden>Έξοδος</button>
</div></header>

<section class="login" id="login">
  <h1>Είσοδος</h1>
  <p>Βάλτε το κλειδί διαχείρισης.</p>
  <form id="loginForm">
    <input id="key" type="password" autocomplete="current-password" placeholder="Κλειδί" required>
    <label><input type="checkbox" id="remember" style="width:auto;margin:0"> Να με θυμάσαι σε αυτή τη συσκευή</label>
    <button class="btn gold" type="submit">Είσοδος</button>
    <p class="err" id="loginErr"></p>
  </form>
</section>

<main class="wrap" id="main" hidden>
  <nav class="views" role="tablist">
    <button class="view" type="button" role="tab" data-view="bookings" aria-selected="true">Ραντεβού</button>
    <button class="view" type="button" role="tab" data-view="settings" aria-selected="false">Ρυθμίσεις</button>
  </nav>
  <div id="vBookings">
  <div class="stats" id="stats"></div>
  <div class="tabs" id="staffFilter" aria-label="Άτομο" hidden></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="list"></div>

  <section class="box">
    <h2>Μπλοκάρισμα χρόνου</h2>
    <p>Μέρες ή ώρες που δεν μπορείτε (άδεια, άλλο ραντεβού). Δεν θα εμφανίζονται για κράτηση.</p>
    <form class="blockform" id="blockForm">
      <input type="date" id="bDate" required>
      <select id="bStaff" hidden aria-label="Για ποιον"></select>
      <select id="bType"><option value="all">Όλη τη μέρα</option><option value="range">Από–έως</option></select>
      <input type="time" id="bFrom" step="1800" value="09:00" hidden>
      <input type="time" id="bTo" step="1800" value="12:00" hidden>
      <input type="text" id="bNote" placeholder="Σημείωση (προαιρετικό)" maxlength="120">
      <button class="btn gold" type="submit">Μπλοκάρισμα</button>
    </form>
    <div id="blocks" style="margin-top:12px"></div>
  </section>
  </div>
  <form class="set" id="vSettings" novalidate hidden></form>
</main>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const B = q.get('b') || 'arakron';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEYNAME = 'appt_admin_' + B;
  const store = {
    get() { try { return sessionStorage.getItem(KEYNAME) || localStorage.getItem(KEYNAME); } catch (e) { return null; } },
    set(v, remember) { try { sessionStorage.setItem(KEYNAME, v); if (remember) localStorage.setItem(KEYNAME, v); } catch (e) {} },
    clear() { try { sessionStorage.removeItem(KEYNAME); localStorage.removeItem(KEYNAME); } catch (e) {} },
  };
  let KEY = store.get(), data = null, tab = 'upcoming', who = '';
  $('bookLink').href = '/' + encodeURIComponent(B);

  const STATUS = { pending: 'Θέλει επιβεβαίωση', confirmed: 'Επιβεβαιωμένο', cancelled: 'Ακυρωμένο' };
  const longDate = d => new Date(d + 'T12:00:00').toLocaleDateString('el-GR', { weekday: 'long', day: 'numeric', month: 'long' });

  async function api(body) {
    const r = await fetch('/.netlify/functions/appt-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ b: B, key: KEY, ...body }) });
    let d = {}; try { d = await r.json(); } catch (e) {}
    if (r.status === 401) { logout('Λάθος κλειδί.'); throw new Error('unauthorized'); }
    if (!r.ok) throw new Error(d.error || 'error');
    return d;
  }
  function toast(msg) {
    const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
  }
  function logout(msg) {
    store.clear(); KEY = null; data = null; dirty = false; setView('bookings');
    $('main').hidden = true; $('logout').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = msg || '';
  }

  async function load() {
    data = await api({ action: 'list' });
    $('login').hidden = true; $('main').hidden = false; $('logout').hidden = false;
    $('bDate').min = data.today;
    $('bizName').textContent = data.name; document.title = data.name + ' · Ραντεβού';
    render();
  }

  function render() {
    const today = data.today;
    const svcName = id => (data.services.find(s => s.id === id) || {}).name || id;
    const people = data.staff || [];
    const stName = id => (people.find(p => p.id === id) || {}).name || '';
    // Φίλτρο ανά άτομο (μόνο όταν υπάρχει προσωπικό)
    $('staffFilter').hidden = people.length < 2;
    if (who && !people.some(p => p.id === who)) who = '';
    $('staffFilter').innerHTML = [{ id: '', name: 'Όλοι' }, ...people].map(p =>
      `<button class="tab" type="button" data-who="${esc(p.id)}" aria-selected="${who === p.id}">${esc(p.name)}</button>`).join('');
    $('staffFilter').querySelectorAll('[data-who]').forEach(b => b.onclick = () => { who = b.dataset.who; render(); });
    $('bStaff').hidden = people.length < 1;
    const keep = $('bStaff').value;
    $('bStaff').innerHTML = `<option value="">Για όλους</option>` + people.filter(p => p.active).map(p => `<option value="${esc(p.id)}">Για: ${esc(p.name)}</option>`).join('');
    $('bStaff').value = keep;
    const mine = b => !who || b.staff === who;
    const live = data.bookings.filter(b => b.status !== 'cancelled' && mine(b));
    const upcoming = live.filter(b => b.date >= today);
    const pending = upcoming.filter(b => b.status === 'pending');
    const weekEnd = new Date(today + 'T12:00:00'); weekEnd.setDate(weekEnd.getDate() + 7);
    const thisWeek = upcoming.filter(b => b.date < weekEnd.toISOString().slice(0, 10));
    $('stats').innerHTML = `
      <div class="stat"><b>${pending.length}</b><span>Θέλουν επιβεβαίωση</span></div>
      <div class="stat"><b>${thisWeek.length}</b><span>Τις επόμενες 7 μέρες</span></div>
      <div class="stat"><b>${upcoming.length}</b><span>Σύνολο επόμενων</span></div>
      <div class="stat"><b>${data.bookings.filter(b => b.source === 'google' && b.created >= Date.now() - 30 * 864e5).length}</b><span>Κρατήσεις από Google (30 μέρες)</span></div>`;

    const lists = {
      upcoming: { label: 'Επόμενα', items: upcoming },
      pending: { label: 'Θέλουν επιβεβαίωση', items: pending },
      past: { label: 'Προηγούμενα', items: live.filter(b => b.date < today).reverse() },
      cancelled: { label: 'Ακυρωμένα', items: data.bookings.filter(b => b.status === 'cancelled' && mine(b)) },
    };
    $('tabs').innerHTML = Object.entries(lists).map(([k, v]) =>
      `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}">${v.label}<span class="n">${v.items.length}</span></button>`).join('');
    $('tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });

    const items = lists[tab].items;
    if (!items.length) { $('list').innerHTML = `<p class="empty">Κανένα ραντεβού εδώ.</p>`; }
    else {
      const byDay = {};
      items.forEach(b => (byDay[b.date] = byDay[b.date] || []).push(b));
      $('list').innerHTML = Object.entries(byDay).map(([d, arr]) => `
        <div class="day"><h3>${esc(longDate(d))}${d === today ? ' · σήμερα' : ''}</h3>
        ${arr.map(b => `
          <article class="bk ${b.status}">
            <div class="tm">${esc(b.time)}<small>έως ${esc(b.end)}</small></div>
            <div class="who"><b>${esc(svcName(b.service))}</b><span class="badge ${b.status}">${STATUS[b.status]}</span>${b.source === 'google' ? '<span class="badge src" title="Από το κουμπί κράτησης του Google">Google</span>' : b.source ? `<span class="badge src">${esc(b.source)}</span>` : ''}
              <div>${b.staff ? `<b style="font-weight:550;color:var(--text)">με ${esc(stName(b.staff) || b.staffName || '')}</b> · ` : ''}${esc(b.name)}${b.company ? ' · ' + esc(b.company) : ''} · ${esc((data.modes[b.mode] || {}).el || b.mode)}</div></div>
            <div class="acts">
              ${b.status === 'pending' ? `<button class="btn ok" data-act="confirm" data-id="${b.id}">✓ Επιβεβαίωση</button>` : ''}
              ${b.status !== 'cancelled' && b.date >= today ? `<button class="btn no" data-act="cancel" data-id="${b.id}">Ακύρωση</button>` : ''}
            </div>
            <div class="more"><a href="tel:${esc(b.phone)}">${esc(b.phone)}</a> · <a href="mailto:${esc(b.email)}">${esc(b.email)}</a>
              ${b.address ? ` · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(b.address)}" target="_blank" rel="noopener">${esc(b.address)}</a>` : ''}
              ${b.extra ? ` · ${esc(b.extra)}` : ''}</div>
            ${b.notes ? `<div class="notes">${esc(b.notes)}</div>` : ''}
          </article>`).join('')}
        </div>`).join('');
    }
    $('list').querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => act(btn));

    $('blocks').innerHTML = data.blocks.length ? data.blocks.map(x => `
      <div class="blk"><b>${esc(longDate(x.date))}</b><span>${x.staff ? esc(stName(x.staff)) + ' · ' : ''}${x.allDay ? 'όλη τη μέρα' : esc(x.from) + '–' + esc(x.to)}${x.note ? ' · ' + esc(x.note) : ''}</span>
      <button class="btn" type="button" data-unblock="${x.id}" data-date="${x.date}">Αφαίρεση</button></div>`).join('') : '';
    $('blocks').querySelectorAll('[data-unblock]').forEach(btn => btn.onclick = async () => {
      btn.disabled = true;
      try { await api({ action: 'unblock', date: btn.dataset.date, id: btn.dataset.unblock }); toast('Αφαιρέθηκε'); await load(); } catch (e) { btn.disabled = false; }
    });
  }

  async function act(btn) {
    const b = data.bookings.find(x => x.id === btn.dataset.id);
    if (btn.dataset.act === 'cancel') {
      if (!confirm(`Ακύρωση του ραντεβού με ${b.name} (${longDate(b.date)}, ${b.time});\nΟ πελάτης θα ενημερωθεί με email.`)) return;
    }
    btn.disabled = true;
    try {
      await api({ action: btn.dataset.act, id: b.id });
      toast(btn.dataset.act === 'confirm' ? 'Επιβεβαιώθηκε, στάλθηκε email' : 'Ακυρώθηκε, στάλθηκε email');
      await load();
    } catch (e) { btn.disabled = false; if (e.message !== 'unauthorized') toast('Σφάλμα, δοκιμάστε ξανά'); }
  }

  $('loginForm').onsubmit = async e => {
    e.preventDefault();
    KEY = $('key').value.trim();
    $('loginErr').textContent = '';
    try { await load(); store.set(KEY, $('remember').checked); $('key').value = ''; }
    catch (err) { if (err.message !== 'unauthorized') $('loginErr').textContent = 'Δεν ήταν δυνατή η σύνδεση.'; }
  };
  $('logout').onclick = () => logout();
  $('bType').onchange = () => { const r = $('bType').value === 'range'; $('bFrom').hidden = $('bTo').hidden = !r; };
  $('blockForm').onsubmit = async e => {
    e.preventDefault();
    const body = { action: 'block', date: $('bDate').value, note: $('bNote').value, staff: $('bStaff').value || '' };
    if ($('bType').value === 'range') { body.from = $('bFrom').value; body.to = $('bTo').value; }
    try { await api(body); toast('Μπλοκαρίστηκε'); $('bNote').value = ''; await load(); }
    catch (err) { if (err.message !== 'unauthorized') toast('Ελέγξτε ημερομηνία και ώρες'); }
  };


  // ================= Ρυθμίσεις =================
  const DAYS = [['mon', 'Δευτέρα'], ['tue', 'Τρίτη'], ['wed', 'Τετάρτη'], ['thu', 'Πέμπτη'], ['fri', 'Παρασκευή'], ['sat', 'Σάββατο'], ['sun', 'Κυριακή']];
  const FIELD_MSG = {
    name: 'Συμπληρώστε το όνομα της επιχείρησης.', phone: 'Το τηλέφωνο δεν είναι σωστό.',
    ownerEmail: 'Το email ειδοποιήσεων δεν είναι σωστό.', site: 'Η ιστοσελίδα πρέπει να ξεκινά με https://',
    logo: 'Το λογότυπο πρέπει να είναι link που ξεκινά με https://', accent: 'Διαλέξτε χρώμα.',
    hours: 'Ελέγξτε το ωράριο: κάθε διάστημα πρέπει να τελειώνει μετά την αρχή του, να μην πέφτει πάνω στο προηγούμενο, και να υπάρχει τουλάχιστον μία ανοιχτή μέρα.',
    slotStep: 'Διαλέξτε κάθε πόσα λεπτά ξεκινούν τα ραντεβού.', minNoticeHours: 'Η ελάχιστη προειδοποίηση πρέπει να είναι 0–168 ώρες.',
    maxDaysAhead: 'Οι μέρες κράτησης μπροστά πρέπει να είναι 1–365.',
    remindHours: 'Διαλέξτε πότε στέλνεται η υπενθύμιση.',
    staff: 'Ελέγξτε το προσωπικό: κάθε άτομο θέλει όνομα, και αν δεν κάνει όλες τις υπηρεσίες, τουλάχιστον μία.',
    staffHours: 'Ελέγξτε το ωράριο του προσωπικού: κάθε διάστημα πρέπει να τελειώνει μετά την αρχή του και να υπάρχει τουλάχιστον μία ανοιχτή μέρα.',
    staffCoverage: 'Υπάρχει ενεργή υπηρεσία που δεν την κάνει κανένα ενεργό άτομο. Τσεκάρετε την υπηρεσία σε κάποιον ή απενεργοποιήστε την.',
    services: 'Ελέγξτε τις υπηρεσίες: κάθε μία θέλει όνομα, διάρκεια 5–600 λεπτά και τουλάχιστον έναν τρόπο. Πρέπει να μείνει τουλάχιστον μία ενεργή.',
  };
  let S = null, view = 'bookings', dirty = false;

  document.querySelectorAll('.view').forEach(b => b.onclick = () => setView(b.dataset.view));
  async function setView(v) {
    if (view === 'settings' && v !== 'settings' && dirty && !confirm('Έχετε αλλαγές που δεν αποθηκεύτηκαν. Να φύγουν;')) return;
    view = v;
    document.querySelectorAll('.view').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    $('vBookings').hidden = v !== 'bookings'; $('vSettings').hidden = v !== 'settings';
    if (v === 'settings') {
      $('vSettings').innerHTML = '<p class="empty">Φόρτωση…</p>';
      try { S = (await api({ action: 'settings' })).settings; dirty = false; renderSettings(); }
      catch (e) { if (e.message !== 'unauthorized') $('vSettings').innerHTML = '<p class="empty">Δεν φορτώθηκαν οι ρυθμίσεις. Δοκιμάστε ξανά.</p>'; }
    } else if (dirty) { dirty = false; }
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  const fld = (label, html, cls = '') => `<label class="fld ${cls}"><span>${label}</span>${html}</label>`;
  const inp = (id, val, attrs = '') => `<input id="${id}" value="${esc(val)}" ${attrs}>`;

  function renderSettings() {
    const svcMode = Object.entries(S.modes);
    $('vSettings').innerHTML = `
      <section class="box">
        <h2>Στοιχεία επιχείρησης</h2>
        <p>Εμφανίζονται στη σελίδα κράτησης και στα email προς τους πελάτες.</p>
        <div class="grid">
          ${fld('Όνομα', inp('sName', S.name, 'maxlength="80" required'))}
          ${fld('Τηλέφωνο', inp('sPhone', S.phone, 'type="tel" maxlength="30"'))}
          ${fld('Υπότιτλος (Ελληνικά)', inp('sTagEl', S.tagline.el, 'maxlength="120" placeholder="π.χ. Κομμωτήριο στο Κουκάκι"'))}
          ${fld('Υπότιτλος (English)', inp('sTagEn', S.tagline.en, 'maxlength="120"'))}
          ${fld('Email ειδοποιήσεων', inp('sEmail', S.ownerEmail, 'type="email" maxlength="120" required') + '<small class="hint">Εδώ έρχεται κάθε νέα κράτηση και ακύρωση.</small>')}
          ${fld('Διεύθυνση', inp('sAddr', S.address, 'maxlength="200"'))}
          ${fld('Ιστοσελίδα', inp('sSite', S.site, 'type="url" maxlength="300" placeholder="https://"'))}
          ${fld('Λογότυπο (link εικόνας)', inp('sLogo', S.logo, 'type="url" maxlength="300" placeholder="https://"'))}
          ${fld('Χρώμα', `<div class="colorrow"><input type="color" id="sAccent" value="${esc(S.accent)}"><span class="hint">Κουμπιά και τονισμοί στη σελίδα κράτησης.</span></div>`)}
          <div class="fld full"><label class="sw"><input type="checkbox" id="sCompany" ${S.askCompany ? 'checked' : ''}>Ζητάμε από τον πελάτη και το όνομα της επιχείρησής του</label>
            <small class="hint">Για επαγγελματίες που εξυπηρετούν επιχειρήσεις (π.χ. λογιστές, σύμβουλοι). Αλλιώς ο πελάτης δίνει μόνο όνομα, τηλέφωνο και email.</small></div>
          ${fld('Φόντο σελίδας κράτησης', `<select id="sMode"><option value="light" ${S.mode !== 'dark' ? 'selected' : ''}>Ανοιχτό</option><option value="dark" ${S.mode === 'dark' ? 'selected' : ''}>Σκούρο</option></select>`)}
        </div>
      </section>

      <section class="box">
        <h2>Ωράριο</h2>
        <p>Οι ώρες που δέχεστε ραντεβού. Για διάλειμμα μέσα στη μέρα, προσθέστε δεύτερο διάστημα.</p>
        <div id="hours">${DAYS.map(([d, label]) => hourRow(d, label)).join('')}</div>
        <button class="link" type="button" id="copyMon">Ίδιο ωράριο με τη Δευτέρα σε όλες τις ανοιχτές μέρες</button>
      </section>

      <section class="box">
        <h2>Κανόνες κράτησης</h2>
        <div class="grid">
          ${fld('Τα ραντεβού ξεκινούν κάθε', `<select id="sStep">${[10, 15, 20, 30, 45, 60].map(n => `<option value="${n}" ${n === S.slotStep ? 'selected' : ''}>${n} λεπτά</option>`).join('')}</select>`)}
          ${fld('Ελάχιστη προειδοποίηση (ώρες)', inp('sNotice', S.minNoticeHours, 'type="number" min="0" max="168" step="1" inputmode="numeric"') + '<small class="hint">Π.χ. 12 = δεν κλείνει κανείς ραντεβού για τις επόμενες 12 ώρες.</small>')}
          ${fld('Κρατήσεις έως (μέρες μπροστά)', inp('sAhead', S.maxDaysAhead, 'type="number" min="1" max="365" step="1" inputmode="numeric"'))}
          ${fld('Υπενθύμιση στον πελάτη με email', `<select id="sRemind">${[[0, 'Καμία'], [1, '1 ώρα πριν'], [2, '2 ώρες πριν'], [3, '3 ώρες πριν'], [24, 'Την προηγούμενη μέρα (24 ώρες πριν)']].map(([v, l]) => `<option value="${v}" ${v === S.remindHours ? 'selected' : ''}>${l}</option>`).join('')}</select>` + '<small class="hint">Λιγότερα «ξέχασα το ραντεβού». Δεν στέλνεται αν ο πελάτης έκλεισε λίγο πριν.</small>')}
        </div>
      </section>

      <section class="box">
        <h2>Υπηρεσίες</h2>
        <p>Ό,τι μπορεί να κλείσει ο πελάτης. Μια υπηρεσία που δεν προσφέρετε πια την απενεργοποιείτε· τα παλιά της ραντεβού μένουν.</p>
        <div id="svcs">${S.services.map((s, i) => svcCard(s, i, svcMode)).join('')}</div>
        <button class="btn" type="button" id="addSvc">+ Νέα υπηρεσία</button>
      </section>

      <section class="box">
        <h2>Προσωπικό</h2>
        <p>Αν ραντεβού δέχονται περισσότερα άτομα, προσθέστε τα εδώ. Ο πελάτης διαλέγει άτομο ή «Οποιοσδήποτε». Αν δεν προσθέσετε κανέναν, η επιχείρηση έχει ένα ημερολόγιο.</p>
        <div id="staffList">${S.staff.map((p, i) => staffCard(p, i)).join('')}</div>
        <button class="btn" type="button" id="addStaff">+ Νέο άτομο</button>
      </section>

      <div class="savebar"><span id="saveState"></span><button class="btn gold" type="submit" id="saveBtn">Αποθήκευση</button></div>`;

    $('copyMon').onclick = () => {
      collect(); const mon = S.hours.mon;
      if (!mon.length) { toast('Η Δευτέρα είναι κλειστή'); return; }
      DAYS.forEach(([d]) => { if (S.hours[d].length) S.hours[d] = mon.map(r => [...r]); });
      changed(); renderSettings();
    };
    $('addSvc').onclick = () => {
      collect();
      S.services.push({ id: '', active: true, name: { el: '', en: '' }, desc: { el: '', en: '' }, price: { el: '', en: '' },
        duration: 30, bufferBefore: 0, bufferAfter: 0, modes: [Object.keys(S.modes)[0]], approval: false, hasExtra: false, open: true });
      changed(); renderSettings();
      const last = $('svcs').lastElementChild; last.scrollIntoView({ behavior: 'smooth', block: 'center' }); last.querySelector('input[data-k="nameEl"]').focus();
    };
    const VS = $('vSettings');
    VS.querySelectorAll('[data-day-open]').forEach(cb => cb.onchange = () => {
      collect(); const d = cb.dataset.dayOpen;
      hoursOf(cb.dataset.hk)[d] = cb.checked ? [['09:00', '17:00']] : [];
      changed(); renderSettings();
    });
    VS.querySelectorAll('[data-add-range]').forEach(b => b.onclick = () => {
      collect(); const d = b.dataset.addRange, r = hoursOf(b.dataset.hk)[d], last = r[r.length - 1];
      r.push([last ? last[1] : '09:00', last && last[1] < '20:00' ? addH(last[1], 3) : '23:59']);
      changed(); renderSettings();
    });
    VS.querySelectorAll('[data-del-range]').forEach(b => b.onclick = () => {
      collect(); const [d, i] = b.dataset.delRange.split(':');
      hoursOf(b.dataset.hk)[d].splice(Number(i), 1); changed(); renderSettings();
    });
    // Προσωπικό
    $('addStaff').onclick = () => {
      collect();
      S.staff.push({ id: '', name: '', active: true, ownHours: false, hours: JSON.parse(JSON.stringify(S.hours)), allServices: true, services: S.services.map(x => x.id), open: true });
      changed(); renderSettings();
      const last = $('staffList').lastElementChild; last.scrollIntoView({ behavior: 'smooth', block: 'center' }); last.querySelector('[data-sk="name"]').focus();
    };
    $('staffList').querySelectorAll('details').forEach(det => det.ontoggle = () => { S.staff[det.dataset.i].open = det.open; });
    $('staffList').querySelectorAll('[data-sk="active"],[data-sk="ownHours"],[data-sk="allServices"]').forEach(cb => cb.onchange = () => { collect(); changed(); renderSettings(); });
    $('staffList').querySelectorAll('[data-sk="name"]').forEach(x => x.oninput = () => {
      x.closest('details').querySelector('summary b').textContent = x.value || 'Νέο άτομο';
    });
    $('svcs').querySelectorAll('details').forEach(det => det.ontoggle = () => { S.services[det.dataset.i].open = det.open; });
    $('svcs').querySelectorAll('[data-k="active"]').forEach(cb => cb.onchange = () => { collect(); changed(); renderSettings(); });
    $('svcs').querySelectorAll('[data-k="nameEl"]').forEach(x => x.oninput = () => {
      x.closest('details').querySelector('summary b').textContent = x.value || 'Νέα υπηρεσία';
    });
    $('vSettings').oninput = changed;
    $('vSettings').onchange = changed;
    $('saveState').textContent = dirty ? 'Υπάρχουν αλλαγές που δεν αποθηκεύτηκαν' : '';
  }
  const addH = (t, n) => { const h = Math.min(23, Number(t.slice(0, 2)) + n); return String(h).padStart(2, '0') + t.slice(2); };
  function changed() { dirty = true; const el = $('saveState'); if (el) el.textContent = 'Υπάρχουν αλλαγές που δεν αποθηκεύτηκαν'; }

  // Επεξεργαστής ωραρίου: key 'biz' = ωράριο επιχείρησης, αριθμός = ωράριο ατόμου S.staff[key]
  const hoursOf = key => key === 'biz' ? S.hours : S.staff[Number(key)].hours;
  function hourRow(d, label, key = 'biz') {
    const r = hoursOf(key)[d] || [];
    return `<div class="hrow" data-day="${d}" data-hk="${key}">
      <label class="dn sw"><input type="checkbox" data-day-open="${d}" data-hk="${key}" ${r.length ? 'checked' : ''}>${label}</label>
      <div class="ranges">${r.length ? r.map((x, i) => `
        <span class="range"><input type="time" data-r="${i}" data-p="0" value="${esc(x[0])}" aria-label="${label} από">–<input type="time" data-r="${i}" data-p="1" value="${esc(x[1])}" aria-label="${label} έως">
        ${r.length > 1 ? `<button class="x" type="button" data-del-range="${d}:${i}" data-hk="${key}" aria-label="Αφαίρεση διαστήματος">×</button>` : ''}</span>`).join('')
        + (r.length < 3 ? `<button class="link" type="button" data-add-range="${d}" data-hk="${key}">+ διάστημα</button>` : '')
        : '<span class="closed">Κλειστά</span>'}</div>
    </div>`;
  }

  function staffCard(p, i) {
    const svcs = S.services.filter(x => x.active);
    const sub = !p.active ? 'ανενεργό' : [p.ownHours ? 'δικό του ωράριο' : 'ωράριο επιχείρησης', p.allServices ? 'όλες οι υπηρεσίες' : `${p.services.length} υπηρεσίες`].join(' · ');
    return `<details class="svc ${p.active ? '' : 'off'}" data-i="${i}" ${p.open ? 'open' : ''}>
      <summary><b>${esc(p.name || 'Νέο άτομο')}</b><small>${esc(sub)}</small><span class="sp"></span>
        <label class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-sk="active" ${p.active ? 'checked' : ''}>Ενεργό</label></summary>
      <div class="body"><div class="grid">
        ${fld('Όνομα', `<input data-sk="name" value="${esc(p.name)}" maxlength="60" placeholder="π.χ. Μαρία">`)}
        <div class="fld"><span>Ωράριο</span><label class="sw"><input type="checkbox" data-sk="ownHours" ${p.ownHours ? 'checked' : ''}>Δικό του ωράριο</label>
          <small class="hint">${p.ownHours ? 'Δέχεται ραντεβού μόνο στις ώρες παρακάτω.' : 'Ίδιο με το ωράριο της επιχείρησης.'}</small></div>
        ${p.ownHours ? `<div class="fld full">${DAYS.map(([d, label]) => hourRow(d, label, String(i))).join('')}</div>` : ''}
        <div class="fld full"><span>Υπηρεσίες</span><label class="sw"><input type="checkbox" data-sk="allServices" ${p.allServices ? 'checked' : ''}>Κάνει όλες τις υπηρεσίες</label>
          ${p.allServices ? '' : `<div class="checks" style="margin-top:8px">${svcs.map(x => `<label><input type="checkbox" data-ssvc="${esc(x.id)}" ${p.services.includes(x.id) ? 'checked' : ''}>${esc(x.name.el || 'Νέα υπηρεσία')}</label>`).join('')}</div>`}</div>
      </div></div>
    </details>`;
  }

  function svcCard(s, i, modes) {
    const k = (key, val, attrs = '') => `<input data-k="${key}" value="${esc(val)}" ${attrs}>`;
    const mins = s.duration + '′' + (s.price.el ? ' · ' + s.price.el : '');
    return `<details class="svc ${s.active ? '' : 'off'}" data-i="${i}" ${s.open ? 'open' : ''}>
      <summary><b>${esc(s.name.el || 'Νέα υπηρεσία')}</b><small>${esc(mins)}</small><span class="sp"></span>
        <label class="sw" onclick="event.stopPropagation()"><input type="checkbox" data-k="active" ${s.active ? 'checked' : ''}>Ενεργή</label></summary>
      <div class="body"><div class="grid">
        ${fld('Όνομα (Ελληνικά)', k('nameEl', s.name.el, 'maxlength="80" required'))}
        ${fld('Όνομα (English)', k('nameEn', s.name.en, 'maxlength="80" placeholder="Αν μείνει κενό, μπαίνει το ελληνικό"'))}
        ${fld('Περιγραφή (Ελληνικά)', `<textarea data-k="descEl" maxlength="400">${esc(s.desc.el)}</textarea>`)}
        ${fld('Περιγραφή (English)', `<textarea data-k="descEn" maxlength="400">${esc(s.desc.en)}</textarea>`)}
        ${fld('Τιμή (Ελληνικά)', k('priceEl', s.price.el, 'maxlength="40" placeholder="π.χ. 25 € ή Δωρεάν. Κενό = δεν εμφανίζεται"'))}
        ${fld('Τιμή (English)', k('priceEn', s.price.en, 'maxlength="40"'))}
        ${fld('Διάρκεια (λεπτά)', k('duration', s.duration, 'type="number" min="5" max="600" step="5" inputmode="numeric"'))}
        <div class="grid" style="gap:12px">
          ${fld('Χρόνος πριν (λεπτά)', k('bufferBefore', s.bufferBefore, 'type="number" min="0" max="240" step="5" inputmode="numeric"'))}
          ${fld('Χρόνος μετά (λεπτά)', k('bufferAfter', s.bufferAfter, 'type="number" min="0" max="240" step="5" inputmode="numeric"'))}
        </div>
        <div class="fld full"><span>Πώς γίνεται</span><div class="checks">${modes.map(([m, label]) =>
          `<label><input type="checkbox" data-mode="${m}" ${s.modes.includes(m) ? 'checked' : ''}>${esc(label)}</label>`).join('')}</div></div>
        <div class="fld full"><label class="sw"><input type="checkbox" data-k="approval" ${s.approval ? 'checked' : ''}>Θέλει δική μου επιβεβαίωση πριν κλείσει</label>
          <small class="hint">Αλλιώς το ραντεβού κλείνει αμέσως.${s.hasExtra ? ' Η επιπλέον ερώτηση αυτής της υπηρεσίας μένει όπως είναι.' : ''}</small></div>
      </div></div>
    </details>`;
  }

  // Διαβάζει τη φόρμα πίσω στο S
  function collect() {
    const v = id => $(id).value.trim();
    S.name = v('sName'); S.phone = v('sPhone'); S.tagline = { el: v('sTagEl'), en: v('sTagEn') };
    S.ownerEmail = v('sEmail'); S.address = v('sAddr'); S.site = v('sSite'); S.logo = v('sLogo'); S.accent = $('sAccent').value; S.mode = $('sMode').value; S.askCompany = $('sCompany').checked;
    S.slotStep = Number($('sStep').value); S.minNoticeHours = Number(v('sNotice')); S.maxDaysAhead = Number(v('sAhead')); S.remindHours = Number($('sRemind').value);
    $('staffList').querySelectorAll('details').forEach(det => {
      const p = S.staff[det.dataset.i], g = key => det.querySelector(`[data-sk="${key}"]`);
      p.open = det.open; p.active = g('active').checked; p.name = g('name').value.trim();
      p.ownHours = g('ownHours').checked; p.allServices = g('allServices').checked;
      const boxes = det.querySelectorAll('[data-ssvc]');
      if (boxes.length) p.services = [...boxes].filter(x => x.checked).map(x => x.dataset.ssvc);
    });
    document.querySelectorAll('#vSettings .hrow').forEach(row => {
      const out = [];
      row.querySelectorAll('input[type=time]').forEach(x => { const i = Number(x.dataset.r); (out[i] = out[i] || ['', ''])[Number(x.dataset.p)] = x.value; });
      hoursOf(row.dataset.hk)[row.dataset.day] = out;
    });
    $('svcs').querySelectorAll('details').forEach(det => {
      const s = S.services[det.dataset.i], g = key => det.querySelector(`[data-k="${key}"]`);
      s.open = det.open; s.active = g('active').checked;
      s.name = { el: g('nameEl').value.trim(), en: g('nameEn').value.trim() };
      s.desc = { el: g('descEl').value.trim(), en: g('descEn').value.trim() };
      s.price = { el: g('priceEl').value.trim(), en: g('priceEn').value.trim() };
      s.duration = Number(g('duration').value); s.bufferBefore = Number(g('bufferBefore').value || 0); s.bufferAfter = Number(g('bufferAfter').value || 0);
      s.modes = [...det.querySelectorAll('[data-mode]')].filter(x => x.checked).map(x => x.dataset.mode);
      s.approval = g('approval').checked;
    });
  }

  $('vSettings').onsubmit = async e => {
    e.preventDefault();
    collect();
    $('vSettings').querySelectorAll('.bad').forEach(x => x.classList.remove('bad'));
    const btn = $('saveBtn'); btn.disabled = true;
    try {
      const r = await fetch('/.netlify/functions/appt-admin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ b: B, key: KEY, action: 'saveSettings', settings: S }) });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { logout('Λάθος κλειδί.'); return; }
      if (r.status === 400 && d.field) { markBad(d.field); alert(FIELD_MSG[d.field] || 'Κάτι δεν είναι σωστό.'); return; }
      if (!r.ok) throw new Error('save');
      const open = S.services.map(s => s.open), openSt = S.staff.map(p => p.open);
      S = d.settings; S.services.forEach((s, i) => { s.open = open[i]; }); S.staff.forEach((p, i) => { p.open = openSt[i]; });
      dirty = false; renderSettings(); toast('Αποθηκεύτηκε · ισχύει ήδη στη σελίδα κράτησης');
      $('bizName').textContent = S.name; document.title = S.name + ' · Ραντεβού';
    } catch (err) { toast('Σφάλμα αποθήκευσης, δοκιμάστε ξανά'); }
    finally { btn.disabled = false; }
  };
  function markBad(field) {
    const map = { name: 'sName', phone: 'sPhone', ownerEmail: 'sEmail', site: 'sSite', logo: 'sLogo', minNoticeHours: 'sNotice', maxDaysAhead: 'sAhead', slotStep: 'sStep' };
    const el = map[field] ? $(map[field]) : field === 'hours' ? $('hours').closest('.box') : field === 'services' ? $('svcs').closest('.box') : /^staff/.test(field) ? $('staffList').closest('.box') : null;
    if (!el) return;
    el.classList.add('bad'); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  if (KEY) load().catch(() => {});
})();
</script>
</body>
</html>
