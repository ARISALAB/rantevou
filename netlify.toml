[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Αυτόματες εργασίες (ώρες σε UTC)
[functions."appt-reminders"]
  schedule = "*/15 * * * *"
[functions."appt-backup"]
  schedule = "30 1 * * *"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/cancel.html"
  [headers.values]
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/superadmin.html"
  [headers.values]
    X-Robots-Tag = "noindex"
